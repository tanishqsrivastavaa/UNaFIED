# Everything local: its own Postgres and Redis, never the shared Neon database.
# Secrets (GROQ_API_KEY, GEMINI_API_KEY, SECRET_AUTH_KEY) come from backend/.env.
# Reminder emails go to Mailpit, a catch-all inbox at http://localhost:8025, never to real people.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: unafied
      POSTGRES_PASSWORD: unafied_dev
      POSTGRES_DB: unafied
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unafied"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  backend: &app
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://unafied:unafied_dev@postgres:5432/unafied
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=true
      - CORS_ORIGINS=http://localhost:5173
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_USER=
      - SMTP_FROM=unafied@localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

  # Runs the Listener on each message and fires due reminders (Celery beat, every 30 seconds).
  worker:
    <<: *app
    ports: []
    command: celery -A app.worker worker -B --loglevel info

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
