<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Conversations with an AI that remembers what was said and asks before it acts." />
    <title>UNaFIED</title>
    <!-- Before first paint: the saved theme, else the system's. Keep in step with src/lib/theme.ts. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("unafied:theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#09090b" : "#ececef");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
